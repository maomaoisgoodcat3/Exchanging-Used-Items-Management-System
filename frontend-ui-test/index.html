<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>UET Marketplace</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="top-navbar">
        <div class="logo">UET Market</div>
        
        <div class="center-toolbar">
            <input type="text" id="searchInput" placeholder="🔍 Tìm bài viết..." oninput="handleFilterSort()">
            <select id="filterType" onchange="handleFilterSort()">
                <option value="">-- Hình thức --</option>
                <option value="Selling">Bán đồ</option>
                <option value="Trading">Trao đổi</option>
                <option value="Donating">Tặng</option>
            </select>
            <select id="filterOpenStatus" onchange="handleFilterSort()">
                <option value="">-- Tình trạng --</option>
                <option value="Available">Sẵn sàng</option>
                <option value="Closed">Đã đóng</option>
            </select>
            <select id="filterApproval" class="admin-filter hidden" onchange="handleFilterSort()" style="border-color: #dc3545; color: #dc3545; font-weight:bold;">
                <option value="">-- [Admin] Duyệt --</option>
                <option value="Pending">Chờ duyệt</option>
                <option value="Approved">Đã duyệt</option>
                <option value="Rejected">Từ chối</option>
            </select>
            <select id="sortSelect" onchange="handleFilterSort()">
                <option value="newest">Mới nhất</option>
                <option value="oldest">Cũ nhất</option>
            </select>
            <button class="btn btn-outline" onclick="clearAllFilters()">✖ Xóa</button>
        </div>

        <div class="nav-actions">
            <button id="btnOpenAuth" class="btn btn-outline" onclick="openModal('authModal')">Đăng Nhập</button>
            <button id="btnOpenPost" class="btn btn-primary hidden" onclick="openModal('postModal')">Đăng Bài</button>
            <button id="btnProfile" class="btn btn-outline hidden" onclick="openModal('profileModal')">👤 Tài khoản</button>
        </div>
    </header>

    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-menu">
                <button class="side-btn active" onclick="switchMainTab('tab-posts')">🛒 Bài Đăng</button>
                <button class="side-btn" onclick="switchMainTab('tab-campaigns')">🚩 Chiến Dịch</button>
            </div>
        </aside>
        <main class="main-content">
            <div id="tab-posts" class="main-tab-content active">
                <h2>Thị trường trao đổi <span id="activeFilterText" class="filter-badge hidden"></span></h2>
                <div class="grid-list" id="globalPostsList"><p class="empty-text">Đang tải dữ liệu...</p></div>
            </div>
            <div id="tab-campaigns" class="main-tab-content hidden">
                <h2>Chiến dịch từ Tổ chức <span id="activeCampFilterText" class="filter-badge hidden"></span></h2>
                <div class="grid-list" id="globalCampaignsList"><p class="empty-text">Chưa có chiến dịch nào.</p></div>
            </div>
        </main>
    </div>

    <div id="postModal" class="modal-overlay">
        <div class="modal-content" style="width: 550px;">
            <span class="close-btn" onclick="closeModal('postModal')">&times;</span>
            <div class="modal-header"><h3>Tạo Bài Đăng Mới</h3></div>
            <div class="modal-body">
                <input type="text" id="postTitle" placeholder="Tiêu đề...">
                <textarea id="postDesc" rows="2" placeholder="Mô tả..."></textarea>
                <select id="postCat">
                    <option value="Selling">Bán đồ (Selling)</option>
                    <option value="Trading">Trao đổi (Trading)</option>
                    <option value="Donating">Tặng (Donating)</option>
                </select>
                
                <div style="background: #f8f9fa; padding: 10px; border-radius: 6px; border: 1px solid #ddd;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                        <label style="margin:0;">Sản phẩm đi kèm (Bắt buộc ít nhất 1)</label>
                        <button class="btn btn-outline" style="padding: 2px 8px; font-size: 12px;" onclick="addProductRow()">+ Thêm</button>
                    </div>
                    <div id="dynamicProductList"></div>
                </div>

                <input type="text" id="postImage" placeholder="URL Ảnh minh họa (Tùy chọn)">
                <div id="postMsg" class="msg"></div>
            </div>
            <div class="modal-footer"><button class="btn btn-warning w-100" onclick="handleCreatePost()">Đăng Lên Hệ Thống</button></div>
        </div>
    </div>

    <div id="profileModal" class="modal-overlay">
        <div class="modal-content profile-layout">
            <span class="close-btn" onclick="closeModal('profileModal')">&times;</span>
            <div class="profile-sidebar">
                <div>
                    <button class="prof-tab-btn active" onclick="switchProfileTab('prof-info')">Thông tin cá nhân</button>
                    <button class="prof-tab-btn" onclick="switchProfileTab('prof-password')">Đổi mật khẩu</button>
                    <button class="prof-tab-btn" onclick="switchProfileTab('prof-transactions')">Lịch sử giao dịch</button>
                    <button class="prof-tab-btn" onclick="switchProfileTab('prof-myposts')">Quản lý Bài đăng</button>
                </div>
                <div style="padding: 0 20px;"><button class="btn btn-danger w-100" onclick="handleLogout()">Đăng Xuất</button></div>
            </div>
            <div class="profile-body">
                <div id="prof-info" class="prof-content active"><h3>Thông tin của bạn</h3><p>(Sẽ cập nhật từ DB)</p></div>
                <div id="prof-password" class="prof-content"><h3>Đổi mật khẩu</h3><p>(Form đổi pass)</p></div>
                <div id="prof-transactions" class="prof-content"><h3>Lịch sử giao dịch</h3><p>(Đang tải...)</p></div>
                <div id="prof-myposts" class="prof-content"><h3>Bài đăng của tôi</h3><div id="miniMyPostsList"></div></div>
            </div>
        </div>
    </div>

    <div id="authModal" class="modal-overlay">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('authModal')">&times;</span>
            <div class="modal-header">
                <h3 id="authTitle">Đăng Nhập</h3>
                <a href="#" onclick="toggleAuthMode()" id="authToggleHint" style="font-size: 13px; color: #0d6efd; text-decoration: none;">Chưa có tài khoản? Đăng ký ngay</a>
            </div>
            <div class="modal-body">
                <input type="email" id="authEmail" placeholder="Email...">
                <input type="text" id="authName" class="hidden" placeholder="Họ và tên">
                <input type="text" id="authPhone" class="hidden" placeholder="Số điện thoại">
                <input type="password" id="authPass" placeholder="Mật khẩu...">
                <div id="authMsg" class="msg"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary w-100" id="btnSubmitAuth" onclick="handleAuth()">Xác Nhận</button>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
